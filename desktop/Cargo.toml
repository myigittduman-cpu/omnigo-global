[package]
name = "omnigo-desktop"
version = "0.2.67"
edition = "2021"
[features]
default = []
microsoft-store = ["windows/ApplicationModel_Activation", "windows/Win32_Storage_EnhancedStorage", "windows/Win32_System_Com_StructuredStorage", "windows/Win32_System_Variant", "windows/Win32_UI_Shell_PropertiesSystem"]
[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "native-tls"] }
rand = "0.9"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde_json = "1"
base64 = "0.22"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
tauri-winrt-notification = "0.8.1"
windows = { version = "0.62.2", features = ["UI_Notifications", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com", "Win32_Storage_FileSystem", "Win32_Media_Audio", "Win32_Security_Cryptography", "Win32_System_WinRT", "ApplicationModel_DataTransfer", "Storage", "Storage_Streams", "Foundation"] }
windows-collections = "0.3.2"

[dev-dependencies]
minisign-verify = "0.2"

[[example]]
name = "verify-release"
path = "verify-release.rs"



<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Omnigo Global</title>
<link rel="stylesheet" href="transition-screen.css">
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:transparent;overflow:hidden;font-family:"Segoe UI",Arial,sans-serif;color:#e5eaf1;user-select:none}
body{position:relative;display:grid;place-items:center;padding:12px}
html:not(.visible) body .transition-ambient{visibility:hidden}
.omnigo-welcome{width:380px;height:380px}
.omnigo-welcome .omnigo-welcome-card{isolation:isolate;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;width:380px;height:380px;padding:26px 28px;border:0;text-align:center;opacity:0}
.visible .omnigo-welcome .omnigo-welcome-card{opacity:1}
.omnigo-welcome .omnigo-welcome-logo{width:252px;flex-shrink:0}
.omnigo-welcome img{display:block;width:100%;height:auto}
.omnigo-welcome h2{margin:16px 0 0;font-size:24px}
.omnigo-welcome .omnigo-welcome-slogan{margin:10px 0 0;color:#b6c1d1;font-size:13px}
.omnigo-welcome .omnigo-welcome-card{transition:opacity 140ms ease}
.omnigo-welcome h2{color:#f4ead5;font-weight:650}
.omnigo-welcome-indicator{display:grid;place-items:center;height:26px;margin-top:12px;color:#edcb86}
.omnigo-welcome-dots,.omnigo-welcome-check{grid-area:1/1}
.omnigo-welcome-dots{display:flex;gap:6px}
.omnigo-welcome-dots span{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.4;animation:omnigo-welcome-pulse 1.2s ease-in-out infinite}
.omnigo-welcome-dots span:nth-child(2){animation-delay:160ms}
.omnigo-welcome-dots span:nth-child(3){animation-delay:320ms}
.omnigo-welcome-check{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.omnigo-welcome-ready .omnigo-welcome-dots{visibility:hidden}
.omnigo-welcome-ready .omnigo-welcome-check{visibility:visible}
.omnigo-welcome-leaving .omnigo-welcome-card{opacity:0}
@keyframes omnigo-welcome-pulse{50%{opacity:1}}
@media(prefers-reduced-motion:reduce){
 .omnigo-welcome-dots span{animation:none}
 .omnigo-welcome .omnigo-welcome-card{transition:none}
}

.visible .omnigo-welcome.omnigo-welcome-leaving .omnigo-welcome-card{opacity:0}
</style>
</head>
<body>
<div id="omnigoWelcome" class="omnigo-welcome" role="status">
  <section class="omnigo-welcome-card">
    <div class="omnigo-welcome-logo">
      <img src="welcome-logo.png" alt="Omnigo Global · E-Ticaret Danışmanlığı" width="1672" height="941" fetchpriority="high">
    </div>
    <h2 id="welcomeTitle" translate="no"></h2>
    <p class="omnigo-welcome-slogan" data-welcome-status>Çalışma alanınız hazırlanıyor…</p>
    <div class="omnigo-welcome-indicator" aria-hidden="true">
      <div class="omnigo-welcome-dots"><span></span><span></span><span></span></div>
      <svg class="omnigo-welcome-check" viewBox="0 0 32 32"><circle cx="16" cy="16" r="14"/><path d="m9 16 5 5 9-10"/></svg>
    </div>
  </section>
</div>
<script>
const welcome = document.getElementById('omnigoWelcome');
const title = window.OMNIGO_WELCOME_ROLE || 'İş Ortağım';
const duration = window.OMNIGO_WELCOME_DURATION_MS || 5000;
document.getElementById('welcomeTitle').textContent = title;
welcome.setAttribute('aria-label', 'Omnigo Global ' + title + ' karşılama ekranı');

function startWhenVisible() {
  if (!document.documentElement.classList.contains('visible')) return;
  observer.disconnect();
  setTimeout(() => {
    welcome.querySelector('[data-welcome-status]').textContent = 'Çalışma alanınız hazır';
    welcome.classList.add('omnigo-welcome-ready');
  }, Math.max(0, duration - 600));
  setTimeout(() => welcome.classList.add('omnigo-welcome-leaving'), Math.max(0, duration - 140));
}

const observer = new MutationObserver(startWhenVisible);
observer.observe(document.documentElement, { attributes: true, attributeFilter: ['class'] });
startWhenVisible();
</script>
<script type="module">
import {addTransitionAmbient} from './transition-ambient.js';
addTransitionAmbient(document.body);
</script>
</body>
</html>
